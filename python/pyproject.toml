[project]
name = "tqe"
version = "1.0.0"
description = "Load Iceberg data into Trino and benchmark partition pruning / predicate pushdown"
requires-python = ">=3.10"
dependencies = ["trino>=0.330"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
