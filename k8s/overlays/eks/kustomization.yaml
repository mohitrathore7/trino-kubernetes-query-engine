apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# EKS overlay. scripts/deploy.sh writes the two generated files below from
# `terraform output`, so no account IDs or bucket names are committed to git.
resources:
  - ../../base

configMapGenerator:
  - name: trino-env
    behavior: merge
    envs:
      - generated.env

patches:
  - path: generated-serviceaccount.yaml
